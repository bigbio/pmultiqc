[project]
name = "pmultiqc"
dynamic = ["version"]
description = "Python package for quality control of proteomics datasets, based on multiqc package"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Yasset Perez-Riverol", email = "ypriverol@gmail.com" },
    { name = "Dai Chengxin", email = "chengxin2024@126.com" },
    { name = "Qi-xuan Yue", email = "yueqx@cqupt.edu.cn" }
]
keywords = [
    "quantms",
    "proteomics",
    "quality control",
    "MultiQC",
    "quality-control",
    "multiqc-plugin",
    "proteomics-qc",
    "mass-spectrometry-report"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python",
    "Programming Language :: JavaScript",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization"
]
requires-python = ">=3.10, <3.14"
dependencies = [
    "multiqc>=1.29, <=1.33",
    "pandas>=1.5",
    "pyteomics",
    "psims",
    "pyopenms<=3.4.0",
    "sdrf-pipelines>=0.1.2",
    "lxml",
    "numpy>=1.23",
    "pyarrow",
    "scikit-learn>=1.2",
    "statsmodels",
    "urllib3>=2.6.1",
]

[project.urls]
Homepage = "https://quantms.org"
Documentation = "https://pmultiqc.quantms.org"
Repository = "https://github.com/bigbio/pmultiqc"
"Bug Tracker" = "https://github.com/bigbio/pmultiqc/issues"
Changelog = "https://github.com/bigbio/pmultiqc/releases"

[project.entry-points."multiqc.modules.v1"]
pmultiqc = "pmultiqc.modules.core:PMultiQC"

[project.entry-points."multiqc.cli_options.v1"]
pmultiqc_version = "pmultiqc.cli:pmultiqc_version"
keep_raw = "pmultiqc.cli:keep_raw"
condition = "pmultiqc.cli:condition"
remove_decoy = "pmultiqc.cli:remove_decoy"
decoy_affix = "pmultiqc.cli:decoy_affix"
contaminant_affix = "pmultiqc.cli:contaminant_affix"
quantification_method = "pmultiqc.cli:quantification_method"
disable_table = "pmultiqc.cli:disable_table"
ignored_idxml = "pmultiqc.cli:ignored_idxml"
affix_type = "pmultiqc.cli:affix_type"
mzid_plugin = "pmultiqc.cli:mzid_plugin"
maxquant_plugin = "pmultiqc.cli:maxquant_plugin"
proteobench_plugin = "pmultiqc.cli:proteobench_plugin"
diann_plugin = "pmultiqc.cli:diann_plugin"
quantms_plugin = "pmultiqc.cli:quantms_plugin"
fragpipe_plugin = "pmultiqc.cli:fragpipe_plugin"
mhcquant_plugin = "pmultiqc.cli:mhcquant_plugin"
qpx_plugin = "pmultiqc.cli:qpx_plugin"
disable_hoverinfo = "pmultiqc.cli:disable_hoverinfo"

[project.entry-points."multiqc.hooks.v1"]
execution_start = "pmultiqc.main:pmultiqc_plugin_execution_start"

[tool.isort]
profile = "black"

[tool.black]
line-length = 99

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.targets.sdist]
exclude = [
    "docs/",
    "tests/",
    "pmultiqc_service/",
    "recipe/",
]

[tool.hatch.build.targets.wheel]
packages = ["pmultiqc"]
